name: Release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "www/**"

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Stamp version
        run: |
          sed -i "s/__APP_VER__/$APP_VERSION/" www/index.html
          sed -i "s#__APP_REPO__#$GITHUB_REPOSITORY#" www/index.html
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 belum diisi. APK memakai kunci acak, jadi update di atas aplikasi lama akan ditolak Android."
          fi
      - run: npm install
      - run: npx cap add android
      - name: Set version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MARKETING.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MARKETING.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare desktop app
        shell: bash
        run: |
          mkdir -p desktop/www
          sed "s/__APP_VER__/$APP_VERSION/" www/index.html > desktop/www/index.html
          cat > desktop/package.json <<'EOF'
          {
            "name": "marketing-desktop",
            "version": "__VER__",
            "description": "MARKETING",
            "author": "MARKETING",
            "main": "main.js",
            "dependencies": {
              "electron-updater": "^6.3.9"
            },
            "devDependencies": {
              "electron": "^33.0.0",
              "electron-builder": "^25.1.8"
            },
            "build": {
              "appId": "com.wahyuredjo.marketing",
              "productName": "MARKETING",
              "files": ["main.js", "www/**/*"],
              "directories": { "output": "dist" },
              "publish": [{ "provider": "github", "owner": "__OWNER__", "repo": "__REPO__" }],
              "win": { "target": ["nsis", "portable"] },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "perMachine": false,
                "createDesktopShortcut": true,
                "artifactName": "MARKETING-Setup-${version}.exe"
              },
              "portable": { "artifactName": "MARKETING-Portable.exe" }
            }
          }
          EOF
          sed -i "s/__VER__/$APP_VERSION/; s#__OWNER__#${GITHUB_REPOSITORY%%/*}#; s#__REPO__#${GITHUB_REPOSITORY#*/}#" desktop/package.json
          cat > desktop/main.js <<'EOF'
          const { app, BrowserWindow, shell, dialog } = require('electron');
          const { autoUpdater } = require('electron-updater');
          const path = require('path');
          if (!app.requestSingleInstanceLock()) app.quit();
          let win;
          function create() {
            win = new BrowserWindow({
              width: 1280, height: 820, minWidth: 420, minHeight: 560,
              autoHideMenuBar: true, backgroundColor: '#0A0F19', title: 'MARKETING',
              webPreferences: {
                autoplayPolicy: 'no-user-gesture-required',
                backgroundThrottling: false,
                contextIsolation: true, nodeIntegration: false, spellcheck: false
              }
            });
            win.setMenuBarVisibility(false);
            win.loadFile(path.join(__dirname, 'www', 'index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (e, url) => {
              if (!url.startsWith('file:')) {
                e.preventDefault();
                if (/^https?:/.test(url)) shell.openExternal(url);
              }
            });
          }
          function setupUpdates() {
            if (!app.isPackaged || process.env.PORTABLE_EXECUTABLE_FILE) return;
            autoUpdater.autoDownload = true;
            autoUpdater.on('update-downloaded', (info) => {
              dialog.showMessageBox(win, {
                type: 'info',
                buttons: ['Mulai ulang sekarang', 'Nanti'],
                defaultId: 0,
                message: 'Pembaruan MARKETING ' + info.version + ' siap dipasang.',
                detail: 'Aplikasi akan dimulai ulang. Data Anda tidak terhapus.'
              }).then((r) => { if (r.response === 0) autoUpdater.quitAndInstall(); });
            });
            const check = () => autoUpdater.checkForUpdates().catch(() => {});
            check();
            setInterval(check, 6 * 60 * 60 * 1000);
          }
          app.on('second-instance', () => {
            if (win) { if (win.isMinimized()) win.restore(); win.focus(); }
          });
          app.whenReady().then(() => { create(); setupUpdates(); });
          app.on('window-all-closed', () => app.quit());
          EOF
      - name: Install and build
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            desktop/dist/MARKETING-Setup-*.exe
            desktop/dist/MARKETING-Portable.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap

  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Build web app
        run: |
          mkdir -p site
          sed "s/__APP_VER__/$APP_VERSION/" www/index.html > site/app.html
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          def icon(size, name, pad=0.0):
              S = size * 4
              im = Image.new("RGB", (S, S), (43, 74, 203))
              d = ImageDraw.Draw(im)
              k = S * (1 - 2 * pad)
              o = S * pad
              pts = [(o + k * 0.27, o + k * 0.52), (o + k * 0.43, o + k * 0.68), (o + k * 0.74, o + k * 0.34)]
              d.line(pts, fill=(255, 255, 255), width=int(k * 0.1), joint="curve")
              for x, y in (pts[0], pts[2]):
                  r = k * 0.05
                  d.ellipse((x - r, y - r, x + r, y + r), fill=(255, 255, 255))
              im.resize((size, size), Image.LANCZOS).save("site/" + name)
          icon(512, "icon-512.png")
          icon(192, "icon-192.png")
          icon(180, "icon-180.png")
          EOF
          cat > site/manifest.webmanifest <<'EOF'
          {
            "name": "MARKETING",
            "short_name": "MARKETING",
            "start_url": ".",
            "scope": ".",
            "display": "standalone",
            "background_color": "#0A0F19",
            "theme_color": "#2B4ACB",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" }
            ]
          }
          EOF
          cat > site/sw.js <<'EOF'
          const C = 'marketing-v1';
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            const r = e.request;
            if (r.method !== 'GET' || new URL(r.url).origin !== location.origin) return;
            e.respondWith(
              fetch(r).then((res) => {
                const cp = res.clone();
                caches.open(C).then((c) => c.put(r, cp));
                return res;
              }).catch(() => caches.match(r).then((m) => m || caches.match('index.html')))
            );
          });
          EOF
          python3 - <<'EOF'
          html = open("site/app.html", encoding="utf-8").read()
          tags = ('<meta name="theme-color" content="#2B4ACB">'
                  '<meta name="apple-mobile-web-app-capable" content="yes">'
                  '<meta name="mobile-web-app-capable" content="yes">'
                  '<meta name="apple-mobile-web-app-title" content="MARKETING">'
                  '<link rel="manifest" href="manifest.webmanifest">'
                  '<link rel="apple-touch-icon" href="icon-180.png">')
          sw = "<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>"
          assert html.count("</head>") == 1 and html.rstrip().endswith("</body></html>")
          html = html.replace("</head>", tags + "</head>", 1)
          i = html.rindex("</body>")
          html = html[:i] + sw + html[i:]
          open("site/index.html", "w", encoding="utf-8").write(html)
          EOF
          rm site/app.html
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: MARKETING ${{ env.APP_VERSION }}
          make_latest: true
          files: out/*
