<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MARKETING</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes on desktop (navigasi | daftar tugas | detail), one column with drawer and sheet on phones. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0E1726; --ink-2:#4A566B; --ink-3:#8793A8;
  --line:#E1E6EE; --accent:#2B4ACB; --accent-ink:#FFFFFF; --accent-soft:#E7ECFD;
  --good:#0F7B58; --warn:#B25B08; --warn-soft:#FDF0DC; --bad:#BF3328; --bad-soft:#FCE9E7;
  --scrim:rgba(10,16,28,.45); --shadow:0 18px 50px rgba(10,20,40,.18);
  --l0:#3B6FE0; --l1:#0E9F6E; --l2:#D9822B; --l3:#8B5CF6; --l4:#DB2777; --l5:#0891B2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F19; --surface:#131A27; --surface-2:#0F1520; --ink:#E7EBF3; --ink-2:#A2ADC1; --ink-3:#6C788E;
    --line:#222C3E; --accent:#7F9BFF; --accent-ink:#0A0F19; --accent-soft:#1B2646;
    --good:#4CC9A0; --warn:#F2B25C; --warn-soft:#2D2312; --bad:#FF8F85; --bad-soft:#341B19;
    --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F19; --surface:#131A27; --surface-2:#0F1520; --ink:#E7EBF3; --ink-2:#A2ADC1; --ink-3:#6C788E;
  --line:#222C3E; --accent:#7F9BFF; --accent-ink:#0A0F19; --accent-soft:#1B2646;
  --good:#4CC9A0; --warn:#F2B25C; --warn-soft:#2D2312; --bad:#FF8F85; --bad-soft:#341B19;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;position:relative}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:0;min-width:0}
.grow{flex:1}
.mono{font-family:var(--f-mono)}

/* Sidebar */
.side{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(300px,86vw);transform:translateX(-104%);transition:transform .22s ease;
  border-radius:0 16px 16px 0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.app[data-drawer="open"] .side{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font:700 21px/1 var(--f-display);letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.navwrap{flex:1;overflow:auto;padding:6px 10px 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:left}
.nav-i:hover{background:var(--surface-2)}
.nav-i[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav-i .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-3)}
.nav-i[aria-current="true"] .n{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-3));flex:none}
.nav-h{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav-h button{color:var(--ink-3);border-radius:8px;padding:3px}
.nav-h button:hover{background:var(--surface-2);color:var(--ink)}
.addlist{padding:4px 10px}
.side-foot{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-2)}
.stat{display:flex;gap:8px;align-items:flex-start}
.stat b{display:block;color:var(--ink);font-weight:600}
.pulse-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--good)}
.pulse-dot.warn{background:var(--warn)} .pulse-dot.bad{background:var(--bad)}
.row-sel{display:flex;gap:6px}
.row-sel select{flex:1;min-width:0}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.mbar{display:flex;align-items:center;gap:12px;padding:18px 20px 6px}
.mtitle{min-width:0;display:flex;align-items:center;gap:14px}
.mtitle h1{margin:0;font:700 28px/1.1 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.mtitle p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:500 11.5px var(--f-mono)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.only-m{display:inline-grid}
.search{display:none;align-items:center;gap:8px;width:min(260px,40%);padding:0 10px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;color:var(--ink)}
.search:focus-within{border-color:var(--accent)}
.app[data-search="open"] .search{display:flex;position:absolute;z-index:5;top:62px;left:16px;right:16px;width:auto;background:var(--surface);box-shadow:var(--shadow)}
.qa{display:flex;gap:8px;padding:10px 20px 4px}
.qa-field{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink-3)}
.qa-field:focus-within{border-color:var(--accent);background:var(--surface)}
.qa-field input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;color:var(--ink);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.qa .btn{height:46px;padding:0 18px}
.qa-hint{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px;min-height:8px}
#content{flex:1;min-height:0;overflow:auto;padding:6px 10px 28px}
.sec{margin-top:10px}
.sec-h{display:flex;gap:8px;align-items:center;margin:14px 10px 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sec-h span{font-family:var(--f-mono);letter-spacing:0}
.sec-h.bad{color:var(--bad)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft);border-color:transparent}
.chk{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--rc,var(--ink-3));display:grid;place-items:center;color:transparent;margin-top:1px;background:transparent}
.chk:hover{background:var(--accent-soft)}
.chk.p1{--rc:var(--accent)} .chk.p2{--rc:var(--warn)} .chk.p3{--rc:var(--bad)}
.done .chk,.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.rbody{flex:1;min-width:0}
.rtitle{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.done .rtitle{color:var(--ink-3);text-decoration:line-through}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;color:var(--ink-3);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip.mono{font-family:var(--f-mono);font-size:12px}
.chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.acc{color:var(--accent)}
.rthumb{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line)}
.empty{max-width:420px;margin:56px auto 0;padding:0 24px;text-align:center;color:var(--ink-2)}
.empty h2{margin:0 0 6px;font:700 20px var(--f-display);color:var(--ink)}
.empty p{margin:0 0 16px}
.qchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500}

/* Calendar */
.cal-h{display:flex;align-items:center;gap:6px;padding:8px 10px}
.cal-h h2{margin:0 8px 0 4px;font:700 20px var(--f-display);letter-spacing:-.02em;text-transform:capitalize}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd{padding:0 10px;color:var(--ink-3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.cal-wd span{padding:6px 6px}
.cal-g{padding:0 10px;gap:4px}
.cell{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:92px;padding:6px;border:1px solid var(--line);border-radius:10px;text-align:left;background:var(--surface);min-width:0;overflow:hidden}
.cell:hover{background:var(--surface-2)}
.cell.out{opacity:.45}
.cell.today .cn{background:var(--accent);color:var(--accent-ink)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cn{align-self:flex-start;min-width:22px;height:22px;padding:0 5px;border-radius:99px;display:grid;place-items:center;font:500 12.5px var(--f-mono)}
.cchip{display:block;padding:1px 6px;border-radius:6px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.cmore{font-size:11.5px;color:var(--ink-3)}
.cdots{display:none;gap:3px}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Detail */
.detail{display:none;position:fixed;z-index:50;inset:0;overflow:auto;background:var(--surface);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app[data-detail="open"] .detail{display:block}
.dpad{padding:16px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;align-items:center;gap:10px}
.dlist{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.dtitle{width:100%;border:0;background:none;outline:0;font:700 22px/1.25 var(--f-display);letter-spacing:-.02em;padding:2px 0;color:var(--ink)}
.dtitle::placeholder{color:var(--ink-3)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span,.lab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);outline:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{margin:0;font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.hint.on{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{height:32px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg button[aria-pressed="true"].p3{color:var(--bad)} .seg button[aria-pressed="true"].p2{color:var(--warn)} .seg button[aria-pressed="true"].p1{color:var(--accent)}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:center;gap:8px}
.sub .chk{width:19px;height:19px}
.sub input{border:0;background:none;padding:6px 4px;border-radius:6px}
.sub.done input{color:var(--ink-3);text-decoration:line-through}
.sub .icon-btn{width:28px;height:28px;opacity:.5}
.sub:hover .icon-btn{opacity:1}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.thumb-open{display:block;width:100%;height:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(10,16,28,.72);color:#fff;display:grid;place-items:center}
.add-img{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:12.5px}
.add-img:hover{border-color:var(--accent);color:var(--accent)}
.dfoot{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.tips{display:flex;flex-direction:column;gap:12px;color:var(--ink-2)}
.tips h2{margin:0;font:700 18px var(--f-display);color:var(--ink)}
.tips dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.tips dt{font:500 12px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);padding:1px 8px;border-radius:6px;justify-self:start}
.tips dd{margin:0}

.notes{columns:2 230px;column-gap:10px;padding:6px 10px 0}
.ncard{display:block;width:100%;text-align:left;break-inside:avoid;margin:0 0 10px;padding:14px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--c) 9%,var(--surface));overflow:hidden}
.ncard:hover{border-color:var(--c)}
.ncard.sel{box-shadow:0 0 0 2px var(--c)}
.ncard img{display:block;width:calc(100% + 28px);max-width:none;margin:-14px -14px 10px;height:120px;object-fit:cover}
.ncard h4{margin:0 0 4px;font:700 16px/1.25 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.ncard p{margin:0;color:var(--ink-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.ncard .chip{margin-top:10px;font-size:12px;color:var(--ink-2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid transparent;display:grid;place-items:center;color:#fff}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.nbody{min-height:220px}
.wk{display:inline-flex;gap:3px;align-items:center}
.wk i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wk i.on{background:var(--good)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:500 13px var(--f-mono);color:var(--ink-2)}
.dd small{font:500 10.5px var(--f-body);color:var(--ink-3)}
.dd.now{border-color:var(--accent)}
.dd.on{background:var(--good);border-color:var(--good);color:#fff}
.dd.on small{color:rgba(255,255,255,.8)}
.streak{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.streak b{font:700 22px var(--f-display);color:var(--ink)}
.cchip.note{background:transparent;border:1px dashed var(--c)}
.cal-add{margin-left:auto}
.row-bk{display:flex;gap:6px}
.row-bk .btn{flex:1}
#syncDlg{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:var(--scrim);padding:16px}
#syncDlg .dlg{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
#syncDlg h2{margin:0;font:700 20px var(--f-display);letter-spacing:-.02em}
#syncDlg p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.5}
#syncDlg ol{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;line-height:1.6}
#syncDlg label{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);line-height:1.4}
#syncDlg a{color:var(--accent);word-break:break-all}
/* Overlays */
.scrim{display:none;position:fixed;inset:0;z-index:45;background:var(--scrim)}
.app[data-drawer="open"] .scrim.sd{display:block;z-index:55}
.app[data-detail="open"] .scrim.sp{display:block}
#alarm{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#alarm.on{display:grid}
.al-card{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.al-top{display:flex;align-items:center;gap:14px}
.al-bell{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:ring 1.1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.al-top h2{margin:0;font:700 22px var(--f-display);letter-spacing:-.02em}
.al-top p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.al-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.al-item b{font-size:16px;overflow-wrap:anywhere}
.al-item small{color:var(--ink-3);font-family:var(--f-mono);font-size:12px}
.al-act{display:flex;flex-wrap:wrap;gap:6px}
.al-snd{margin:0;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
#lb{position:fixed;inset:0;z-index:110;display:none;place-items:center;background:rgba(5,8,14,.88);padding:16px}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
#lb button{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}

<script>
(function(){
'use strict';

/* ---------- utilities ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseYmd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){return ymd(new Date())};
var startOfToday=function(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)};
var lsGet=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var lsSet=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};

var P={
  plus:'M12 5v14M5 12h14', check:'M5 12.5l4.5 4.5L19 7.5',
  bell:'M6 16v-5a6 6 0 0112 0v5l1.5 2h-15zM10 21h4',
  image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01',
  cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
  menu:'M4 7h16M4 12h16M4 17h16', x:'M6 6l12 12M18 6L6 18',
  trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',
  repeat:'M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4',
  flag:'M6 21V4M6 4h11l-2 4 2 4H6',
  search:'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
  sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',
  up:'M5 12h14M13 6l6 6-6 6',
  all:'M4 5h16v4H4zM5 9v10h14V9M10 13h4',
  done:'M12 3a9 9 0 100 18 9 9 0 000-18zM8 12.5l3 3 5-6',
  cloud:'M7 18a4 4 0 010-8 5.5 5.5 0 0110.6 1.5A3.3 3.3 0 0117 18z',
  cl:'M15 6l-6 6 6 6', cr:'M9 6l6 6-6 6',
  list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
  sound:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6',
  clock:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2',
  flame:'M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',
  note:'M5 4h14v16H5zM8 9h8M8 13h8M8 17h5'
};
function ic(n,s){s=s||18;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>'}

/* ---------- state ---------- */
var DEFAULT_LISTS=[{id:'pribadi',name:'Pribadi',color:0},{id:'kerja',name:'Kerja',color:1},{id:'belanja',name:'Belanja',color:2}];
var S={
  tasks:new Map(), notes:new Map(), ncol:null, lists:DEFAULT_LISTS.slice(), view:'today', sel:null, q:'',
  calMonth:(function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})(), calDay:today(),
  col:null, meta:null, mode:'boot', loaded:false, err:null, assets:null,
  sound:lsGet('tugasku.sound')||'lonceng', audioOn:false, addingList:false, confirmDel:null, lb:null, showDone:false
};
var dirty=new Set(), timers={}, chain={};
var app=$('#app');

function listOf(id){return S.lists.find(function(l){return l.id===id})||S.lists[0]}
function cur(){return S.sel?(S.tasks.get(S.sel)||S.notes.get(S.sel)||null):null}

function newNote(o){
  return Object.assign({id:uid(),kind:'note',title:'',body:'',date:'',endDate:'',color:0,images:[],created:Date.now(),updated:Date.now()},o||{});
}
function normNote(n){
  n.kind='note'; n.title=n.title||''; n.body=n.body||''; n.date=n.date||''; n.endDate=n.endDate||'';
  n.color=+n.color||0; n.images=Array.isArray(n.images)?n.images:[]; return n;
}
function newTask(o){
  return Object.assign({id:uid(),title:'',notes:'',done:false,doneAt:0,due:'',time:'',remind:null,ack:0,snooze:0,priority:0,
    list:S.lists[0].id,repeat:'none',daily:false,doneDates:[],subs:[],images:[],created:Date.now(),updated:Date.now()},o||{});
}
function normalize(t){
  t.subs=Array.isArray(t.subs)?t.subs:[]; t.images=Array.isArray(t.images)?t.images:[]; t.daily=!!t.daily; t.doneDates=Array.isArray(t.doneDates)?t.doneDates:[];
  t.title=t.title||''; t.notes=t.notes||''; t.due=t.due||''; t.time=t.time||'';
  t.priority=+t.priority||0; t.repeat=t.repeat||'none'; t.ack=+t.ack||0; t.snooze=+t.snooze||0;
  t.remind=(t.remind===null||t.remind===undefined||t.remind==='')?null:+t.remind;
  return t;
}

/* ---------- persistence (cloud db, or this device) ---------- */
function lsSave(){lsSet('tugasku.v1',JSON.stringify({tasks:Array.from(S.tasks.values()),notes:Array.from(S.notes.values()),lists:S.lists}));if(!S.merging)noteLocalChange()}
function quietSave(){S.merging=true;try{lsSave()}finally{S.merging=false}}
function save(x){if(x.kind==='note')persistNote(x);else persist(x)}
function persist(t){
  t.updated=Date.now(); S.tasks.set(t.id,t);
  if(S.mode==='cloud'){
    dirty.add(t.id); clearTimeout(timers[t.id]);
    timers[t.id]=setTimeout(function(){flush(t.id)},300);
  } else lsSave();
  renderStatus();
}
function flush(id){
  delete timers[id];
  var t=S.tasks.get(id); if(!t){dirty.delete(id);return}
  var stamp=t.updated, body=JSON.parse(JSON.stringify(t));
  var write=function(){return S.col.doc(id).set(body)};
  chain[id]=(chain[id]||Promise.resolve()).then(write).catch(function(e){
    if(e&&e.code==='unavailable') return new Promise(function(r){setTimeout(r,700)}).then(write);
    throw e;
  }).then(function(){
    var c=S.tasks.get(id); if(!c||(c.updated===stamp&&!timers[id])) dirty.delete(id);
    S.err=null;
  }).catch(function(e){S.err=e||{};dirty.delete(id)}).then(renderStatus);
}
function removeTask(t){
  markDel(t.id); S.tasks.delete(t.id); dirty.delete(t.id); clearTimeout(timers[t.id]); delete timers[t.id];
  if(S.mode==='cloud'){
    chain[t.id]=(chain[t.id]||Promise.resolve()).then(function(){return S.col.doc(t.id).delete()}).catch(function(e){S.err=e||{}}).then(renderStatus);
  } else lsSave();
  if(S.assets) t.images.forEach(function(im){if(im.id) S.assets.delete(im.id).catch(function(){})});
}
function persistNote(n){
  n.updated=Date.now(); S.notes.set(n.id,n);
  if(S.mode==='cloud'){
    var k='n:'+n.id; dirty.add(k); clearTimeout(timers[k]);
    timers[k]=setTimeout(function(){flushNote(n.id)},300);
  } else lsSave();
  renderStatus();
}
function flushNote(id){
  var k='n:'+id; delete timers[k];
  var n=S.notes.get(id); if(!n){dirty.delete(k);return}
  var stamp=n.updated, body=JSON.parse(JSON.stringify(n));
  var write=function(){return S.ncol.doc(id).set(body)};
  chain[k]=(chain[k]||Promise.resolve()).then(write).catch(function(e){
    if(e&&e.code==='unavailable') return new Promise(function(r){setTimeout(r,700)}).then(write);
    throw e;
  }).then(function(){
    var c=S.notes.get(id); if(!c||(c.updated===stamp&&!timers[k])) dirty.delete(k);
    S.err=null;
  }).catch(function(e){S.err=e||{};dirty.delete(k)}).then(renderStatus);
}
function removeNote(n){
  var k='n:'+n.id; markDel(n.id); S.notes.delete(n.id); dirty.delete(k); clearTimeout(timers[k]); delete timers[k];
  if(S.mode==='cloud'){
    chain[k]=(chain[k]||Promise.resolve()).then(function(){return S.ncol.doc(n.id).delete()}).catch(function(e){S.err=e||{}}).then(renderStatus);
  } else lsSave();
  if(S.assets) n.images.forEach(function(im){if(im.id) S.assets.delete(im.id).catch(function(){})});
}
function saveLists(){
  if(S.mode==='cloud') S.meta.doc('lists').set({items:S.lists}).catch(function(e){S.err=e||{};renderStatus()});
  else lsSave();
}

/* ---------- dates ---------- */
var dfShort=new Intl.DateTimeFormat('id-ID',{weekday:'short',day:'numeric',month:'short'});
var dfLong=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
var dfMonth=new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric'});
function fmtDay(s){
  var d=parseYmd(s), t0=new Date();t0.setHours(0,0,0,0);
  var diff=Math.round((d-t0)/864e5);
  if(diff===0) return 'Hari ini'; if(diff===1) return 'Besok'; if(diff===-1) return 'Kemarin';
  return dfShort.format(d);
}
function dueMs(t){return t.due?new Date(t.due+'T'+(t.time||'23:59')).getTime():null}
function isOverdue(t){var m=dueMs(t);return !t.done&&m!==null&&m<Date.now()}
function rel(ms){
  var m=Math.max(1,Math.round(ms/60000));
  if(m<60) return m+' menit'; var h=Math.round(m/60); if(h<48) return h+' jam'; return Math.round(h/24)+' hari';
}
function addRepeat(t){
  var d=parseYmd(t.due), T=today(), n=0;
  do{
    if(t.repeat==='daily') d.setDate(d.getDate()+1);
    else if(t.repeat==='weekly') d.setDate(d.getDate()+7);
    else d.setMonth(d.getMonth()+1);
    n++;
  }while(ymd(d)<T&&n<400);
  t.due=ymd(d);
}

/* ---------- daily + notes helpers ---------- */
function isDoneToday(t){return t.doneDates.indexOf(today())>-1}
function streak(t){
  var d=new Date(), n=0; if(t.doneDates.indexOf(ymd(d))<0) d.setDate(d.getDate()-1);
  while(t.doneDates.indexOf(ymd(d))>-1&&n<1000){n++;d.setDate(d.getDate()-1)}
  return n;
}
function toggleDaily(t,date){
  date=date||today(); var i=t.doneDates.indexOf(date);
  if(i>-1) t.doneDates.splice(i,1); else t.doneDates.push(date);
  if(t.doneDates.length>400) t.doneDates=t.doneDates.sort().slice(-400);
  persist(t);
}
function dailyStrip(t,n,btn){
  var T=today(), out='', now=new Date(), wd=['S','S','R','K','J','S','M'];
  for(var i=n-1;i>=0;i--){
    var x=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i), k=ymd(x), on=t.doneDates.indexOf(k)>-1;
    out+=btn?'<button class="dd'+(on?' on':'')+(k===T?' now':'')+'" data-act="dday" data-d="'+k+'" aria-pressed="'+on+'" aria-label="'+esc(dfShort.format(x))+'"><small>'+wd[(x.getDay()+6)%7]+'</small>'+x.getDate()+'</button>':'<i class="'+(on?'on':'')+'"></i>';
  }
  return out;
}
function fmtRange(n){
  if(!n.date) return '';
  if(n.endDate&&n.endDate!==n.date) return dfShort.format(parseYmd(n.date))+' – '+dfShort.format(parseYmd(n.endDate));
  return dfShort.format(parseYmd(n.date));
}

/* ---------- alarm math ---------- */
function alarmTime(t){
  if(t.remind===null||!t.time) return null;
  var base;
  if(t.daily){
    if(isDoneToday(t)) return null;
    base=new Date(today()+'T'+t.time).getTime();
  } else {
    if(t.done||!t.due) return null;
    base=new Date(t.due+'T'+t.time).getTime();
  }
  return isNaN(base)?null:base-t.remind*60000;
}
function firingList(){
  var now=Date.now(), out=[];
  S.tasks.forEach(function(t){
    var a=alarmTime(t); if(a===null||t.ack===a) return;
    var at=(t.snooze&&t.snooze>a)?t.snooze:a;
    if(now>=at&&now-at<3*864e5) out.push({t:t,at:at});
  });
  return out.sort(function(x,y){return x.at-y.at});
}
var REMIND=[['','Tanpa pengingat'],[0,'Tepat waktu'],[5,'5 menit sebelumnya'],[15,'15 menit sebelumnya'],[30,'30 menit sebelumnya'],[60,'1 jam sebelumnya'],[1440,'1 hari sebelumnya']];

/* ---------- quick add parser ---------- */
function parseQuick(s){
  var title=s, due='', time='', priority=0, daily=false, m;
  if(/\b(setiap hari|tiap hari|harian)\b/i.test(title)){daily=true;title=title.replace(/\b(setiap hari|tiap hari|harian)\b/i,'')}
  var words=[[/\bhari ini\b/i,0],[/\bbesok\b/i,1],[/\blusa\b/i,2]];
  for(var i=0;i<words.length;i++){
    if(words[i][0].test(title)){var x=new Date();x.setDate(x.getDate()+words[i][1]);due=ymd(x);title=title.replace(words[i][0],'');break}
  }
  m=title.match(/\b(\d{1,2}):(\d{2})\b/)||title.match(/\bjam\s*(\d{1,2})(?:[.:](\d{2}))?\b/i);
  if(m){
    var h=+m[1], mi=m[2]?+m[2]:0;
    if(h<24&&mi<60){time=pad(h)+':'+pad(mi);title=title.replace(m[0],'').replace(/\bjam\b/i,'')}
  }
  m=title.match(/(^|\s)(!{1,3})(?=\s|$)/);
  if(m){priority=m[2].length;title=title.replace(m[0],' ')}
  title=title.replace(/\s+/g,' ').trim();
  return {title:title,due:due,time:time,priority:priority,daily:daily};
}
function ctx(){
  var o={}, v=S.view;
  if(v.indexOf('list:')===0) o.list=v.slice(5);
  if(v==='today') o.due=today();
  if(v==='calendar') o.due=S.calDay;
  if(v==='important') o.priority=3;
  if(v==='daily') o.daily=true;
  return o;
}
function createFromQuick(text){
  var p=parseQuick(text); if(!p.title) return false;
  var base=ctx(), o=Object.assign({},base,{title:p.title}), daily=!!(p.daily||base.daily);
  if(p.priority) o.priority=p.priority;
  if(daily){
    o.daily=true; o.due='';
    if(p.time){o.time=p.time;o.remind=0}
  } else {
    if(p.due) o.due=p.due;
    if(p.time){
      o.time=p.time; o.remind=0;
      if(!o.due){
        var now=new Date(), at=new Date(today()+'T'+p.time);
        o.due=at<now?ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)):today();
      }
    }
  }
  persist(newTask(o)); return true;
}
function seed(){
  var add=function(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
  var sub=function(t){return {id:uid(),t:t,d:false}};
  [
    {title:'Rapat mingguan tim',due:add(0),time:'14:00',priority:2,list:'kerja',notes:'Siapkan ringkasan progres minggu ini.'},
    {title:'Belanja kebutuhan dapur',due:add(1),list:'belanja',subs:[sub('Beras 5 kg'),sub('Telur'),sub('Sayur dan buah')]},
    {title:'Bayar tagihan listrik',due:add(3),time:'09:00',priority:3,list:'pribadi',remind:60},
    {title:'Minum vitamin',daily:true,time:'07:00',list:'pribadi',remind:0},
    {title:'Olahraga pagi',daily:true,time:'06:00',list:'pribadi',remind:15},
    {title:'Susun draf presentasi',list:'kerja',priority:1}
  ].forEach(function(o){persist(newTask(o))});
  var nm=new Date(), a=new Date(nm.getFullYear(),nm.getMonth()+1,1), b=new Date(nm.getFullYear(),nm.getMonth()+1,15);
  persistNote(newNote({title:'Ide promo bulan depan (contoh)',color:3,date:ymd(a),endDate:ymd(b),
    body:'Konsep: diskon pembukaan bulan dan paket bundling.\nIde konten: foto produk, testimoni pelanggan, countdown di story.\nTarget: tentukan angka penjualan dan anggaran iklan.'}));
  render(); toast('Contoh ditambahkan');
}

/* ---------- views ---------- */
function cmp(a,b){
  var da=a.due||'9999', db=b.due||'9999'; if(da!==db) return da<db?-1:1;
  var ta=a.time||'99:99', tb=b.time||'99:99'; if(ta!==tb) return ta<tb?-1:1;
  if(a.priority!==b.priority) return b.priority-a.priority;
  return a.created-b.created;
}
function byDone(a,b){return (b.doneAt||0)-(a.doneAt||0)}
function visible(){
  var arr=Array.from(S.tasks.values()), q=S.q.trim().toLowerCase();
  if(!q) return arr;
  return arr.filter(function(t){return (t.title+' '+t.notes+' '+t.subs.map(function(s){return s.t}).join(' ')).toLowerCase().indexOf(q)>-1});
}
function sections(){
  var T=today(), all=visible(), v=S.view;
  var dl=all.filter(function(t){return t.daily}).sort(function(a,b){var x=a.time||'99:99',y=b.time||'99:99';return x<y?-1:x>y?1:a.created-b.created});
  var rest=all.filter(function(t){return !t.daily});
  var act=rest.filter(function(t){return !t.done}), dn=rest.filter(function(t){return t.done});
  if(S.q.trim()) return [{title:'Hasil pencarian',tasks:act.sort(cmp).concat(dl,dn.sort(byDone))}];
  if(v==='today'){
    var sod=startOfToday();
    return [
      {title:'Terlambat',cls:'bad',tasks:act.filter(function(t){return t.due&&t.due<T}).sort(cmp)},
      {title:'Harian',tasks:dl},
      {title:'Hari ini',tasks:act.filter(function(t){return t.due===T}).sort(cmp)},
      {title:'Selesai hari ini',tasks:dn.filter(function(t){return t.doneAt>=sod}).sort(byDone)}
    ];
  }
  if(v==='daily') return [{title:'Tugas harian',tasks:dl}];
  if(v==='upcoming'){
    var g=new Map();
    act.filter(function(t){return t.due&&t.due>T}).sort(cmp).forEach(function(t){if(!g.has(t.due))g.set(t.due,[]);g.get(t.due).push(t)});

  }

  if(v==='important') return [{title:'Prioritas tinggi',tasks:act.filter(function(t){return t.priority===3}).sort(cmp)}];
  if(v==='done') return [{title:'Selesai',tasks:dn.sort(byDone)}];
  if(v.indexOf('list:')===0){
    var id=v.slice(5), inL=function(t){return listOf(t.list).id===id};
    return [{title:'Aktif',tasks:act.filter(inL).sort(cmp)},{title:'Harian',tasks:dl.filter(inL)},{title:'Selesai',tasks:dn.filter(inL).sort(byDone)}];

function counts(){
  var T=today(), c={today:0,upcoming:0,all:0,important:0,done:0,daily:0,notes:S.notes.size,lists:{}};
  S.tasks.forEach(function(t){
    if(t.daily){c.daily++;if(!isDoneToday(t))c.today++;return}
    if(t.done){c.done++;return}
    c.all++; if(t.due&&t.due<=T) c.today++; if(t.due&&t.due>T) c.upcoming++; if(t.priority===3) c.important++;
    var l=listOf(t.list).id; c.lists[l]=(c.lists[l]||0)+1;
  });
  return c;
}

/* ---------- images ---------- */
function shrink(file,max,q){
  return createImageBitmap(file).then(function(bm){
    var r=Math.min(1,max/Math.max(bm.width,bm.height)), w=Math.round(bm.width*r), h=Math.round(bm.height*r);
    var cv=document.createElement('canvas');cv.width=w;cv.height=h;
    var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(bm,0,0,w,h);
    return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',q)});
  });
}
function blobToData(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result)};f.onerror=rej;f.readAsDataURL(b)})}
async function makeImage(file,t){
  if(S.assets){
    var b=await shrink(file,1600,.84), r=await S.assets.upload(b);
    return {id:r.id};
  }
  var small=await shrink(file,640,.6), d=await blobToData(small);
  var used=t.images.reduce(function(n,im){return n+(im.d?im.d.length:0)},0), cap=S.mode==='cloud'?180000:900000;
  if(used+d.length>cap) throw new Error('cap');
  return {d:d};
}
async function addImages(files){
  var t=cur(); if(!t) return; var n=0;
  for(var i=0;i<files.length;i++){
    var f=files[i]; if(!/^image\//.test(f.type)) continue;
    try{t.images.push(await makeImage(f,t));n++}
    catch(e){toast(e&&e.message==='cap'?'Gambar terlalu besar untuk penyimpanan saat ini':'Gambar tidak bisa diproses atau diunggah')}
  }
  if(n){save(t);renderList();renderDetail(true)}
}

/* ---------- backup: export / import ---------- */
var RE_D=/^\d{4}-\d{2}-\d{2}$/, RE_T=/^\d{2}:\d{2}$/, RE_ID=/^[A-Za-z0-9_-]{1,60}$/;
function cleanId(x){return RE_ID.test(String(x||''))?String(x):uid()}
function cleanTask(t){
  var c=normalize(Object.assign({},t));
  c.id=cleanId(t.id); c.title=String(c.title).slice(0,300); c.notes=String(c.notes).slice(0,20000);
  c.due=RE_D.test(c.due)?c.due:''; c.time=RE_T.test(c.time)?c.time:'';
  c.priority=Math.min(3,Math.max(0,c.priority|0));
  c.repeat=['none','daily','weekly','monthly'].indexOf(c.repeat)>-1?c.repeat:'none';
  c.remind=(c.remind!==null&&isFinite(c.remind))?c.remind:null;
  c.done=!!c.done; c.doneAt=+c.doneAt||0; c.created=+c.created||Date.now();
  c.list=String(c.list||S.lists[0].id);
  c.subs=c.subs.filter(function(x){return x&&typeof x.t==='string'}).slice(0,100).map(function(x){return {id:String(x.id||uid()),t:x.t.slice(0,300),d:!!x.d}});
  c.doneDates=c.doneDates.filter(function(d){return typeof d==='string'&&RE_D.test(d)}).slice(-400);
  c.images=[]; delete c.kind; return c;
}
function cleanNote(n){
  var c=normNote(Object.assign({},n));
  c.id=cleanId(n.id); c.title=String(c.title).slice(0,300); c.body=String(c.body).slice(0,50000);
  c.date=RE_D.test(c.date)?c.date:''; c.endDate=RE_D.test(c.endDate)?c.endDate:'';
  if(!c.date) c.endDate=''; if(c.endDate&&c.endDate<c.date) c.endDate=c.date;
  c.color=Math.abs(c.color|0)%6; c.created=+c.created||Date.now(); c.images=[]; return c;
}
function imgToData(src){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){
      try{
        var cv=document.createElement('canvas'); cv.width=im.naturalWidth; cv.height=im.naturalHeight;
        var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0);
        res(cv.toDataURL('image/jpeg',.9));
      }catch(e){rej(e)}
    };
    im.onerror=function(){rej(new Error('img'))};
    im.src=src;
  });
}
function dataToBlob(d){
  var p=d.split(','), m=/^data:([^;,]+)/.exec(p[0]), bin=atob(p[1]), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:m?m[1]:'image/jpeg'});
}
async function exportData(){
  if(S.busy) return;
  var dl=null; try{dl=await claude.use('downloads')}catch(e){}
  if(!dl){toast('Unduh file tidak tersedia di tampilan ini');return}
  S.busy=true; toast('Menyiapkan cadangan…');
  var missing=0;
  var pack=async function(images){
    var out=[];
    for(var i=0;i<images.length;i++){
      var im=images[i];
      if(im.d){out.push({d:im.d});continue}
      try{out.push({d:await imgToData('/_blob/'+im.id)})}catch(e){missing++}
    }
    return out;
  };
  try{
    var tasks=[], notes=[], arr, i, c;
    arr=Array.from(S.tasks.values());
    for(i=0;i<arr.length;i++){c=JSON.parse(JSON.stringify(arr[i]));c.images=await pack(arr[i].images);tasks.push(c)}
    arr=Array.from(S.notes.values());

    var doc={app:'MARKETING',version:1,exportedAt:new Date().toISOString(),lists:S.lists,tasks:tasks,notes:notes};
    var blob=new Blob([JSON.stringify(doc)],{type:'application/json'});

  }catch(e){

  }

async function importData(file){
  if(S.busy) return;
  var doc;
  try{doc=JSON.parse(await file.text())}catch(e){toast('File bukan cadangan yang valid');return}
  if(!doc||doc.app!=='MARKETING'||!Array.isArray(doc.tasks)||(doc.notes&&!Array.isArray(doc.notes))){toast('File ini bukan cadangan MARKETING');return}
  S.busy=true;
  var notes=doc.notes||[], total=doc.tasks.length+notes.length, n=0, lost=0, skipped=0, added=0;
  (Array.isArray(doc.lists)?doc.lists:[]).forEach(function(l){
    if(l&&l.id&&l.name&&!S.lists.some(function(x){return x.id===String(l.id)})){S.lists.push({id:String(l.id),name:String(l.name).slice(0,30),color:Math.abs(+l.color|0)%6});added++}
  });
  if(added) saveLists();
  var restore=async function(images,target,cap){
    var list=Array.isArray(images)?images:[];
    for(var i=0;i<list.length;i++){
      var im=list[i];
      if(!im||typeof im.d!=='string'||im.d.indexOf('data:image/')!==0||im.d.length>6e6){lost++;continue}
      try{
        if(S.assets){var r=await S.assets.upload(dataToBlob(im.d));target.images.push({id:r.id})}
        else{
          var used=target.images.reduce(function(a,x){return a+(x.d?x.d.length:0)},0);
          if(used+im.d.length>cap){lost++;continue}
          target.images.push({d:im.d});
        }
      }catch(e){lost++}
    }
  };
  var cap=S.mode==='cloud'?180000:900000, i, c;
  try{
    for(i=0;i<doc.tasks.length;i++){
      if(!doc.tasks[i]||typeof doc.tasks[i]!=='object'){skipped++;continue}
      c=cleanTask(doc.tasks[i]); await restore(doc.tasks[i].images,c,cap); persist(c);
      n++; if(n%3===0) toast('Mengimpor '+n+' dari '+total+'…');
    }
    for(i=0;i<notes.length;i++){
      if(!notes[i]||typeof notes[i]!=='object'){skipped++;continue}
      c=cleanNote(notes[i]); await restore(notes[i].images,c,cap); persistNote(c);
      n++; if(n%3===0) toast('Mengimpor '+n+' dari '+total+'…');
    }
  }catch(e){toast('Impor berhenti di tengah jalan. Coba lagi dengan file yang sama.');S.busy=false;render();return}
  S.busy=false; render();
  toast('Impor selesai: '+doc.tasks.length+' tugas, '+notes.length+' catatan'+(lost?'. '+lost+' gambar tidak bisa dipulihkan':'')+(skipped?'. '+skipped+' item dilewati':''));
}

/* ---------- sync (GitHub Gist) ---------- */
var SYNC_FILE='marketing-data.json';
function syncCfg(){try{return JSON.parse(lsGet('tugasku.sync')||'{}')||{}}catch(e){return {}}}
function syncSet(o){lsSet('tugasku.sync',JSON.stringify(o))}
function delMap(){try{return JSON.parse(lsGet('tugasku.del')||'{}')||{}}catch(e){return {}}}
function markDel(id){var m=delMap();m[id]=Date.now();lsSet('tugasku.del',JSON.stringify(m))}
async function gh(path,opt){
  var cfg=syncCfg(), o=opt||{}, h={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'};
  if(o.body) h['Content-Type']='application/json';
  var r=await fetch('https://api.github.com'+path,{method:o.method||'GET',headers:h,body:o.body});
  if(!r.ok){var er=new Error('GitHub '+r.status);er.status=r.status;throw er}
  return r.json();
}
async function findGist(cfg){
  if(cfg.gistId) return cfg.gistId;
  for(var page=1;page<=5;page++){
    var list=await gh('/gists?per_page=100&page='+page);
    if(!list.length) break;
    var g=list.find(function(x){return x.files&&x.files[SYNC_FILE]});
    if(g) return g.id;
    if(list.length<100) break;
  }
  return null;
}
async function readGist(id){
  var g=await gh('/gists/'+id), f=g.files&&g.files[SYNC_FILE]; if(!f) return null;
  var text=f.content;
  if(f.truncated||typeof text!=='string'){var r=await fetch(f.raw_url);if(!r.ok)throw new Error('raw '+r.status);text=await r.text()}
  try{return JSON.parse(text)}catch(e){return null}
}
async function packImages(images){
  var out=[], list=Array.isArray(images)?images:[];
  for(var i=0;i<list.length;i++){
    var im=list[i];
    if(im&&im.d){out.push({d:im.d});continue}
    if(im&&im.id){try{out.push({d:await imgToData('/_blob/'+im.id)})}catch(e){}}
  }
  return out;
}
async function restoreImages(src){
  var out=[], list=Array.isArray(src)?src:[], used=0, cap=S.mode==='cloud'?180000:900000;
  for(var i=0;i<list.length;i++){
    var im=list[i];
    if(!im||typeof im.d!=='string'||im.d.indexOf('data:image/')!==0||im.d.length>6e6) continue;
    try{
      if(S.assets){var r=await S.assets.upload(dataToBlob(im.d));out.push({id:r.id})}
      else{if(used+im.d.length>cap) continue; used+=im.d.length; out.push({d:im.d})}
    }catch(e){}
  }
  return out;
}
async function mergeRemote(rem){
  var del=delMap(), rd=rem.deleted||{}, changed=0, cloud=S.mode==='cloud', added=0;
  Object.keys(rd).forEach(function(k){var v=+rd[k]||0;if(!del[k]||v>del[k])del[k]=v});
  (Array.isArray(rem.lists)?rem.lists:[]).forEach(function(l){
    if(l&&l.id&&l.name&&!S.lists.some(function(x){return x.id===String(l.id)})){S.lists.push({id:String(l.id),name:String(l.name).slice(0,30),color:Math.abs(+l.color|0)%6});added++}
  });
  if(added){changed+=added;if(cloud)saveLists();else quietSave()}
  var take=async function(items,map,clean,note){
    var arr=Array.isArray(items)?items:[];
    for(var i=0;i<arr.length;i++){
      var r=arr[i]; if(!r||typeof r!=='object'||!r.id) continue;
      var c=clean(r), ru=+r.updated||0, loc=map.get(c.id);
      if(del[c.id]&&del[c.id]>=ru) continue;
      if(loc&&(+loc.updated||0)>=ru) continue;
      c.updated=ru||Date.now(); c.images=await restoreImages(r.images);
      if(loc&&S.assets) loc.images.forEach(function(im){if(im.id)S.assets.delete(im.id).catch(function(){})});
      map.set(c.id,c); changed++;
      if(cloud){dirty.add(note?'n:'+c.id:c.id); if(note)flushNote(c.id); else flush(c.id)}
    }
  };
  await take(rem.tasks,S.tasks,cleanTask,false); await take(rem.notes,S.notes,cleanNote,true);
  [[S.tasks,false],[S.notes,true]].forEach(function(p){
    var map=p[0];
    Array.from(map.keys()).forEach(function(id){
      var x=map.get(id);
      if(del[id]&&del[id]>=(+x.updated||0)){
        map.delete(id); changed++;
        if(cloud) (p[1]?S.ncol:S.col).doc(id).delete().catch(function(){});
        if(S.assets) x.images.forEach(function(im){if(im.id)S.assets.delete(im.id).catch(function(){})});
      }
    });
  });
  lsSet('tugasku.del',JSON.stringify(del));
  if(!cloud) quietSave();
  return changed;
}
async function buildDoc(){
  var del=delMap(), cut=Date.now()-90*864e5, tasks=[], notes=[], arr, i, c;
  Object.keys(del).forEach(function(k){if(del[k]<cut)delete del[k]});
  lsSet('tugasku.del',JSON.stringify(del));
  arr=Array.from(S.tasks.values());
  for(i=0;i<arr.length;i++){c=JSON.parse(JSON.stringify(arr[i]));c.images=await packImages(arr[i].images);tasks.push(c)}
  arr=Array.from(S.notes.values());
  for(i=0;i<arr.length;i++){c=JSON.parse(JSON.stringify(arr[i]));c.images=await packImages(arr[i].images);notes.push(c)}
  return {app:'MARKETING',version:2,syncedAt:new Date().toISOString(),lists:S.lists,tasks:tasks,notes:notes,deleted:del};
}
async function syncExport(){
  if(S.busy||S.syncing) return;

  if(S.busy||S.syncing) return;

async function syncNow(opt){
  opt=opt||{}; var quiet=!!opt.quiet;
  if(S.syncing||S.busy||S.mode!=='local') return;
  var cfg=syncCfg();
  if(!cfg.token){if(!quiet)openSync();return}
  S.syncing=true; S.syncErr='';
  if(quiet) renderStatus(); else {renderSide();toast('Menyinkronkan…')}
  var msg='', changed=0, pushed=false, count='';
  try{
    var id=await findGist(cfg);
    if(id){var rem=await readGist(id);if(rem&&rem.app==='MARKETING')changed=await mergeRemote(rem)}
    if(!id||S.localDirty||!cfg.last){
      var rev=S.rev, doc=await buildDoc(), body={files:{}};
      body.files[SYNC_FILE]={content:JSON.stringify(doc)};
      if(id) await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify(body)});
      else{body.description='MARKETING sync data';body['public']=false;var g=await gh('/gists',{method:'POST',body:JSON.stringify(body)});id=g.id}
      if(S.rev===rev) S.localDirty=false;
      pushed=true; count=doc.tasks.length+' tugas, '+doc.notes.length+' catatan';
    }
    cfg=syncCfg(); cfg.gistId=id; cfg.last=Date.now(); syncSet(cfg);
    if(quiet) msg=changed?'Data diperbarui dari perangkat lain':'';
    else msg='Sync selesai'+(count?': '+count:'')+(changed?'. '+changed+' perubahan dimuat dari penyimpanan':'');
  }catch(e){
    if(e&&e.status===404&&cfg.gistId&&!opt.retry){cfg=syncCfg();cfg.gistId='';syncSet(cfg);S.syncing=false;return syncNow({quiet:quiet,retry:true})}
    if(e&&e.status===401) msg='Token ditolak GitHub. Buat token baru lewat tombol Atur.';
    else if(e&&e.status===403) msg='Token belum punya izin Gist, atau batas GitHub tercapai.';
    else if(e&&e.status===422) msg='Data terlalu besar untuk Gist. Kurangi gambar lampiran.';
    else msg='Sync gagal. Periksa koneksi internet.';
    S.syncErr=msg; if(quiet) msg='';
  }
  S.syncing=false;
  if(changed||!quiet) render(); else renderStatus();
  if(changed&&quiet) scheduleRender();
  if(msg) toast(msg);
}
function openSync(){
  closeSync();
  var cfg=syncCfg(), m=document.createElement('div'); m.id='syncDlg';
  m.innerHTML='<div class="dlg" role="dialog" aria-label="Pengaturan sync"><h2>Sinkronisasi</h2>'+
    '<p>Data disimpan sebagai file JSON di GitHub Gist pribadi (rahasia) milik akun Anda. Perangkat lain memuatnya dengan token yang sama.</p>'+
    '<ol><li>Buka <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=MARKETING%20sync" target="_blank" rel="noopener">github.com/settings/tokens/new</a></li>'+
    '<li>Centang izin <b>gist</b>, buat token, lalu salin.</li><li>Tempel token di bawah (sama di semua perangkat).</li></ol>'+
    '<label><input type="checkbox" id="syncAuto"'+(cfg.auto!==false?' checked':'')+'><span>Sync otomatis: setelah setiap perubahan, saat aplikasi dibuka, dan tiap 45 detik.</span></label>'+
    '<input type="password" id="syncTok" placeholder="ghp_… atau github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(cfg.token||'')+'">'+
    '<div class="row-bk"><button class="btn" data-act="syncclose">Batal</button><button class="btn primary" data-act="syncsave">Simpan &amp; Sync</button></div>'+
    (cfg.token?'<button class="btn sm danger" data-act="syncreset">Hapus token dari perangkat ini</button>':'')+'</div>';
  document.body.appendChild(m);
}
function closeSync(){var d=$('#syncDlg');if(d)d.remove()}
function saveSyncToken(){
  var v=($('#syncTok').value||'').trim();
  if(!/^[A-Za-z0-9_]{20,}$/.test(v)){toast('Token tidak valid');return}
  var cfg=syncCfg(); if(cfg.token!==v) cfg={token:v};
  cfg.auto=$('#syncAuto').checked;
  syncSet(cfg); closeSync(); syncNow();
}

/* ---------- app update (GitHub Releases, APK) ---------- */
var APP_REPO='__APP_REPO__', APP_VER='__APP_VER__';
function verNum(v){var p=String(v).replace(/^v/,'').split('.');return +p[p.length-1]||0}
async function checkAppUpdate(){
  if(!window.Capacitor||APP_REPO.indexOf('__')===0||S.update) return;
  try{
    var r=await fetch('https://api.github.com/repos/'+APP_REPO+'/releases/latest'); if(!r.ok) return;
    var j=await r.json(), tag=j.tag_name||'';
    if(verNum(tag)>verNum(APP_VER)){
      var a=(j.assets||[]).find(function(x){return /\.apk$/i.test(x.name)});
      if(a){S.update={ver:String(tag).replace(/^v/,''),url:a.browser_download_url};renderSide()}
    }
  }catch(e){}
}

/* ---------- alarm engine ---------- */
var ac=null, ringTimer=0, flashTimer=0, firingKey='';
function unlockAudio(){
  try{
    if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();ac.onstatechange=function(){setAudio(ac.state==='running')}}
    if(ac.state!=='running') ac.resume().then(function(){setAudio(true);if(ringTimer)playOnce()}).catch(function(){});
    else setAudio(true);
  }catch(e){}
}
function setAudio(on){if(S.audioOn!==on){S.audioOn=on;renderSide();renderAlarm()}}
function tone(f,t0,dur,type,vol){
  var o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.03);
}
function playOnce(kind){
  if(!ac||ac.state!=='running') return; kind=kind||S.sound; var n=ac.currentTime+.03;
  if(kind==='lonceng'){[0,.34,.68].forEach(function(d){tone(988,n+d,1.1,'sine',.28);tone(1480,n+d,.8,'sine',.12)})}
  else if(kind==='digital'){for(var i=0;i<4;i++)tone(1040,n+i*.2,.11,'square',.12)}
  else {[523,659,784,1047].forEach(function(f,i){tone(f,n+i*.16,.5,'triangle',.22)})}
}
function startRing(){
  if(ringTimer) return; playOnce();
  ringTimer=setInterval(function(){playOnce();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}},2600);
  var base='MARKETING', flip=false; flashTimer=setInterval(function(){flip=!flip;document.title=flip?'Alarm! MARKETING':base},900);
}
function stopRing(){
  clearInterval(ringTimer);clearInterval(flashTimer);ringTimer=0;flashTimer=0;document.title='MARKETING';
}
function renderAlarm(){
  var list=firingList(), el=$('#alarm'), key=list.map(function(x){return x.t.id+':'+x.at}).join('|');
  if(!list.length){el.classList.remove('on');el.innerHTML='';stopRing();firingKey='';return}
  el.classList.add('on'); startRing();
  var now=Date.now();
  var items=list.map(function(x){
    var late=now-x.at, t=x.t;
    return '<div class="al-item"><div><b>'+esc(t.title||'Tanpa judul')+'</b><br><small>'+(t.daily?'Harian · '+esc(t.time):(t.due?esc(fmtDay(t.due))+(t.time?' · '+t.time:''):''))+' · '+(late<90000?'Sekarang':'terlewat '+rel(late))+'</small></div>'+
      '<div class="al-act"><button class="btn sm primary" data-act="al-done" data-id="'+t.id+'">Selesai</button><button class="btn sm" data-act="al-snooze" data-id="'+t.id+'" data-m="5">Tunda 5 menit</button><button class="btn sm" data-act="al-snooze" data-id="'+t.id+'" data-m="60">1 jam</button><button class="btn sm" data-act="al-off" data-id="'+t.id+'">Matikan</button></div></div>';
  }).join('');
  el.innerHTML='<div class="al-card"><div class="al-top"><div class="al-bell">'+ic('bell',26)+'</div><div><h2 id="alTitle">Pengingat tugas</h2><p>'+list.length+' alarm menunggu</p></div></div>'+
    (S.audioOn?'':'<p class="al-snd">Suara belum aktif. <button class="btn sm" data-act="unlock">Bunyikan alarm</button></p>')+
    items+(list.length>1?'<button class="btn" data-act="al-off-all">Matikan semua</button>':'')+'</div>';
  firingKey=key;
}
var lastMinute=0;
function tick(){
  var key=firingList().map(function(x){return x.t.id+':'+x.at}).join('|');
  if(key!==firingKey||(key&&Math.floor(Date.now()/60000)!==lastMinute)) renderAlarm();
  var m=Math.floor(Date.now()/60000);
  if(m!==lastMinute){lastMinute=m;renderTitle();renderList()}
}

/* ---------- events ---------- */
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')unlockAudio()});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-view]'); if(!el) return;
  if(el.dataset.view){setView(el.dataset.view);return}
  var a=el.dataset.act, id=el.dataset.id, t=id?S.tasks.get(id):cur(), i=+el.dataset.i;
  switch(a){
    case 'toggle': e.stopPropagation(); if(t){toggleDone(t);render()} break;
    case 'open': if(t) openTask(t.id); break;
    case 'close': closeDetail(); break;
    case 'dtoggle': if(t){toggleDone(t);renderList();renderSide();renderTitle();renderDetail(true)} break;
    case 'prio': if(t){t.priority=+el.dataset.v;persist(t);renderList();renderDetail(true)} break;
    case 'subtoggle': if(t&&t.subs[i]){t.subs[i].d=!t.subs[i].d;persist(t);renderList();renderDetail(true)} break;
    case 'subdel': if(t){t.subs.splice(i,1);persist(t);renderList();renderDetail(true)} break;
    case 'addimg': $('#file').click(); break;
    case 'imgdel': if(t&&t.images[i]){var im=t.images.splice(i,1)[0];if(im.id&&S.assets)S.assets.delete(im.id).catch(function(){});save(t);renderList();renderDetail(true)} break;
    case 'lb': if(t&&t.images[i]){S.lb={tid:t.id,i:i};showLb()} break;
    case 'lbclose': S.lb=null;showLb(); break;
    case 'del': S.confirmDel=S.sel;renderDetail(true); break;
    case 'delno': S.confirmDel=null;renderDetail(true); break;
    case 'delyes': if(t){if(t.kind==='note')removeNote(t);else removeTask(t);S.sel=null;S.confirmDel=null;render();toast(t.kind==='note'?'Catatan dihapus':'Tugas dihapus')} break;
    case 'calprev': S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()-1,1);renderTitle();renderList(); break;
    case 'calnext': S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()+1,1);renderTitle();renderList(); break;
    case 'caltoday': var n=new Date();S.calMonth=new Date(n.getFullYear(),n.getMonth(),1);S.calDay=today();renderTitle();renderList(); break;
    case 'calday': S.calDay=el.dataset.d;renderList(); break;
    case 'addlist': S.addingList=true;renderSide();var ln=$('#listName');if(ln)ln.focus(); break;
    case 'menu': app.dataset.drawer='open'; break;
    case 'scrim': app.dataset.drawer='closed'; break;
    case 'search': app.dataset.search=app.dataset.search==='open'?'closed':'open';if(app.dataset.search==='open')$('#q').focus(); break;
    case 'seed': seed(); break;
    case 'appupdate': if(S.update) window.open(S.update.url,'_blank'); break;
    case 'sync': syncNow(); break;
    case 'syncexp': syncExport(); break;
    case 'syncimp': $('#syncFile').click(); break;
    case 'syncset': openSync(); break;
    case 'syncclose': closeSync(); break;
    case 'syncsave': saveSyncToken(); break;
    case 'syncreset': syncSet({}); closeSync(); renderSide(); toast('Pengaturan sync dihapus dari perangkat ini'); break;
    case 'export': exportData(); break;
    case 'import': $('#impFile').click(); break;
    case 'kind': if(t&&t.kind!=='note'){var dv=el.dataset.v==='1';if(dv!==!!t.daily){t.daily=dv;t.snooze=0;if(dv){t.due='';t.repeat='none';t.done=false;t.doneAt=0}else{t.due=today()}persist(t);render();renderDetail(true)}} break;
    case 'dday': if(t&&t.daily){toggleDaily(t,el.dataset.d);render();renderDetail(true)} break;
    case 'opennote': openTask(id); break;
    case 'newnote': var nn=newNote({date:el.dataset.d||'',color:S.notes.size%6});persistNote(nn);render();openTask(nn.id);setTimeout(function(){var x=$('.dtitle');if(x)x.focus()},60); break;
    case 'ncolor': if(t&&t.kind==='note'){t.color=+el.dataset.v;persistNote(t);renderList();renderDetail(true)} break;
    case 'unlock': unlockAudio(); break;
    case 'test': unlockAudio(); setTimeout(function(){playOnce();if(!S.audioOn)toast('Ketuk sekali lagi jika suara belum terdengar')},120); break;
    case 'al-done': if(t){toggleDone(t);render();renderAlarm()} break;
    case 'al-snooze': if(t){t.snooze=Date.now()+(+el.dataset.m)*60000;persist(t);renderAlarm();toast('Ditunda '+el.dataset.m+' menit')} break;
    case 'al-off': if(t){t.ack=alarmTime(t)||0;persist(t);renderAlarm();renderList()} break;
    case 'al-off-all': firingList().forEach(function(x){x.t.ack=alarmTime(x.t)||0;persist(x.t)});renderAlarm();renderList(); break;
  }
});
document.addEventListener('keydown',function(e){
  var el=e.target;
  if(e.key==='Enter'&&el.classList&&el.classList.contains('row')&&e.target===el){openTask(el.dataset.id);return}
  if(e.key==='Enter'&&el.dataset&&el.dataset.f==='subnew'){
    e.preventDefault(); var t=cur(), v=el.value.trim();
    if(t&&v){t.subs.push({id:uid(),t:v,d:false});persist(t);renderList();renderDetail(true);var n=$('[data-f="subnew"]');if(n)n.focus()}
    return;
  }
  if(e.key==='Escape'){
    if(S.lb){S.lb=null;showLb();return}
    if(app.dataset.drawer==='open'){app.dataset.drawer='closed';return}
    if(S.addingList){S.addingList=false;renderSide();return}
    if(S.sel) closeDetail();
    return;
  }
  var typing=/INPUT|TEXTAREA|SELECT/.test(el.tagName);
  if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='n'||e.key==='N'){e.preventDefault();$('#qa').focus()}
    else if(e.key==='/'){e.preventDefault();app.dataset.search='open';$('#q').focus()}
  }
});
document.addEventListener('input',function(e){
  var f=e.target.dataset&&e.target.dataset.f; if(!f) return; var t=cur(); if(!t) return;
  if(f==='title'){t.title=e.target.value;persist(t);renderList();renderTitle()}
  else if(f==='notes'){t.notes=e.target.value;persist(t)}
  else if(f==='ntitle'){t.title=e.target.value;persistNote(t);renderList()}
  else if(f==='nbody'){t.body=e.target.value;persistNote(t);renderList()}
  else if(f==='sub'){var i=+e.target.dataset.i;if(t.subs[i]){t.subs[i].t=e.target.value;persist(t);renderList()}}
});
document.addEventListener('change',function(e){
  var el=e.target, f=el.dataset&&el.dataset.f;
  if(el.id==='soundSel'){S.sound=el.value;lsSet('tugasku.sound',S.sound);unlockAudio();setTimeout(function(){playOnce()},120);return}
  if(f==='ndate'||f==='nend'){
    var nt=cur(); if(!nt||nt.kind!=='note') return;
    if(f==='ndate'){nt.date=el.value;if(!nt.date)nt.endDate='';else if(nt.endDate&&nt.endDate<nt.date)nt.endDate=nt.date}
    else{nt.endDate=el.value;if(nt.endDate&&!nt.date)nt.date=nt.endDate;if(nt.endDate&&nt.endDate<nt.date)nt.endDate=nt.date}
    persistNote(nt);renderList();renderDetail(true);return;
  }
  if(!f||['due','time','remind','list','repeat'].indexOf(f)<0) return;
  var t=cur(); if(!t) return;
  setField(t,f,el.value); persist(t); render(); renderDetail(true);
});
$('#syncFile').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(f)syncImport(f)});
$('#impFile').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(f)importData(f)});
$('#file').addEventListener('change',function(e){var fs=Array.from(e.target.files);e.target.value='';addImages(fs)});
$('#q').addEventListener('input',function(e){S.q=e.target.value;renderSide();renderTitle();renderList()});

document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
function showLb(){
  var el=$('#lb');
  if(!S.lb){el.classList.remove('on');el.innerHTML='';return}

$('#lb').addEventListener('click',function(e){if(e.target.id==='lb'){S.lb=null;showLb()}});

/* ---------- startup ---------- */
$('#btnMenu').innerHTML=ic('menu'); $('#btnSearch').innerHTML=ic('search'); $('#searchIc').innerHTML=ic('search',17);
$('#qaIc').innerHTML=ic('plus',18); $('#qaBtnIc').innerHTML=ic('plus',16);
app.dataset.drawer='closed'; app.dataset.search='closed';
render();

function startLocal(){
  S.mode='local';
  try{
    var raw=lsGet('tugasku.v1');
    if(raw){var d=JSON.parse(raw);(d.tasks||[]).forEach(function(t){S.tasks.set(t.id,normalize(t))});(d.notes||[]).forEach(function(n){S.notes.set(n.id,normNote(n))});if(Array.isArray(d.lists)&&d.lists.length)S.lists=d.lists}
  }catch(e){}
  S.loaded=true; scheduleRender(); tick();
}
async function init(){
  if(!window.claude||!window.claude.use){startLocal();return}
  var db=null,user=null,id=null;
  try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(!db||!id){startLocal();return}
  try{S.assets=await claude.use('assets')}catch(e){S.assets=null}
  var prof=db.doc('data/users/'+id+'/profile');
  S.col=prof.collection('tasks'); S.meta=prof.collection('meta'); S.ncol=prof.collection('notes'); S.mode='cloud';
  S.meta.doc('lists').onSnapshot(function(snap){
    if(snap.exists){var d=snap.data();if(d&&Array.isArray(d.items)&&d.items.length){S.lists=d.items;scheduleRender()}}
  },function(e){S.err=e;renderStatus()});
  S.col.onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){
      var did=ch.doc.id;
      if(ch.type==='removed'){if(!dirty.has(did))S.tasks.delete(did);return}
      if(dirty.has(did)) return;
      var d=ch.doc.data(); if(!d) return;
      S.tasks.set(did,normalize(Object.assign({},d,{id:did})));
    });
    S.loaded=true; S.err=null; scheduleRender(); tick();
  },function(e){S.err=e;S.loaded=true;scheduleRender()});
  S.ncol.onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){
      var did=ch.doc.id, k='n:'+did;
      if(ch.type==='removed'){if(!dirty.has(k))S.notes.delete(did);return}
      if(dirty.has(k)) return;
      var d=ch.doc.data(); if(!d) return;
      S.notes.set(did,normNote(Object.assign({},d,{id:did})));
    });
    scheduleRender();
  },function(e){S.err=e;renderStatus()});
  scheduleRender();
}
S.localDirty=true; S.rev=0;
init();
setInterval(tick,5000);
setInterval(autoPoll,45000);
setTimeout(autoPoll,2500);
setTimeout(checkAppUpdate,4000);
setInterval(checkAppUpdate,6*3600*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){setTimeout(autoPoll,300);setTimeout(checkAppUpdate,1500)}});
window.addEventListener('online',function(){setTimeout(autoPoll,500)});
})();
